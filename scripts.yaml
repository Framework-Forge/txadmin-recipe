# ============================================================== #
#            FORGEBOX - CATÁLOGO DE SCRIPTS DA VITRINE           #
# ============================================================== #
# Este arquivo é lido dinamicamente pelo Forgebox Installer.
# Na opção "Forge Completa", todos os scripts são instalados.
# Na opção "Forge Custom", o usuário seleciona quais deseja.

scripts:
