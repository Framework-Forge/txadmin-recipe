    description: "Núcleo principal da Framework-Forge com ciclo de vida, eventos de jogador, gerenciamento de grupos e integração total."
    version: "v1.0.0"
    branch: "main"
    repoUrl: "https://github.com/Framework-Forge/forge-core"
    tags: ["core", "framework", "essencial"]
    dependenciesCount: 0
    isCore: true

  - id: "pr_bridge"
