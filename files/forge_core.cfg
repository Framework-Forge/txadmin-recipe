# Forge Core
# Liga ou desliga o sistema de pagamento do forge-core.
set forge:paycheck:enabled true

# Intervalo do pagamento em minutos.
# Exemplos: 10, 20, 30, 60.
set forge:paycheck:interval 10

# Conta onde o salario sera depositado.
# Opcoes: "bank", "cash", "crypto".
set forge:paycheck:account "bank"

# Define se o player recebe salario mesmo fora de servico.
set forge:paycheck:payOffDuty false

# Define se o salario sai da conta da sociedade/empresa.
# Se false, o dinheiro e pago diretamente pelo sistema.
set forge:paycheck:society false

# Percentual do salario de empregos comuns debitado da sociedade.
# O restante e criado pelo servidor, mas o player sempre recebe o salario integral.
# Empregos MEI ignoram este percentual e pagam obrigatoriamente 100% pela sociedade.
set forge:paycheck:societyPercent 100

# Mostra notificacao para o player quando receber salario.
set forge:paycheck:notify true

