##############
### COMPATIBILIDADE PR BRIDGE ###
##############

# Cores da integração visual do PR Bridge
setr ox:primaryColor blue
setr ox:primaryShade 8

# Preferência de idioma da integração visual
setr ox:userLocales 0

# Carregar arquivo de idioma específico de dados/localidades
setr ox:locale "pt-br"

# Registro
# Para ativar o registro em log, escolha um provedor de serviços e siga as instruções aqui: https://github.com/Pierremoraes-ofc/pr_bridge

# set ox:logger "fivemanage"
# defina cincomanage:key "YOUR_API_KEY"

####################
### OX INVENTORY ###
####################

## Shared

# Ative funções e manipuladores de eventos específicos (suportados: ox, esx, qbx, nd)
setr inventory:framework "forge"

# Número de slots para inventários de jogadores
setr inventory:slots 20

# Capacidade máxima de carga para jogadores, em gramas (será automaticamente convertida em quilogramas no jogo)
setr inventory:weight 20000

# Suporte integrado para esconderijos, lojas e crafting pelo target nativo do pr_bridge
setr inventory:target true

# Empregos com acesso ao arsenal policial, armários de evidências, etc.
setr inventory:police ["police", "bcso", "sasp"]

## Cliente

# O URL para carregar imagens de itens
setr inventory:imagepath "nui://ox_inventory/web/images"

# As armas serão recarregadas após atingir 0 munição
setr inventory:autoreload false

# Desfoque a tela ao acessar o inventário
setr inventory:screenblur true

# Teclas de atalho padrão para acessar inventários primários e secundários e barra de atalho
setr inventory:keys ["TAB", "K", "F1"]

# Habilitar ação de controle quando o inventário estiver aberto
setr inventory:enablekeys [249]

# As armas devem ser apontadas antes de disparar
setr inventory:aimedfiring false

# Mostrar uma lista de todos os jogadores próximos ao dar itens
setr inventory:giveplayerlist true

# Ativar animações de armas ao colocar no coldre
setr inventory:weaponanims false

# Alternar notificações de itens (adicionar/remover)
setr inventory:itemnotify true

# Alternar notificações de itens de armas (equipar/coldre)
setr inventory:weaponnotify true

# Desative os marcadores de queda e gere um acessório
setr inventory:dropprops true

# Defina o modelo padrão usado para drop props
setr inventory:dropmodel "prop_med_bag_01b"

# Desarme o jogador se uma arma inesperada estiver em uso (ou seja, não usou o item da arma)
setr inventory:weaponmismatch true

# Ignorar verificações de incompatibilidade de armas para o tipo de arma fornecido (por exemplo, ['WEAPON_SHOVEL', 'WEAPON_HANDCUFFS'])
setr inventory:ignoreweapons []

# Suprimir coletas de armas e munições
setr inventory:suppresspickups 1

## Servidor

# Compare a versão atual com a versão mais recente no GitHub
set inventory:versioncheck true

# Os stashes serão apagados após permanecerem inalterados pelo tempo determinado
set inventory:clearstashes "6 MONTH"

# URL do webhook do Discord, usado para moderação de conteúdo de metadados de URL de imagem (incorporação de imagens)
set inventory:webhook ""

# Registro da integração do inventário (0: Desativar, 1: Padrão, 2: Incluir AddItem/RemoveItem e todas as compras na loja)
set inventory:loglevel 1

# Os preços dos itens flutuam nas lojas
set inventory:randomprices false

# O saque será gerado aleatoriamente dentro de veículos e lixeiras sem dono
set inventory:randomloot true

# Grau mínimo de trabalho para remover itens de armários de evidências
set inventory:evidencegrade 2

# Corte os espaços em branco das placas dos veículos ao verificar os veículos próprios
set inventory:trimplate true

# Defina o conteúdo dos inventários gerados aleatoriamente
# [nome do item, mínimo, máximo, chance de saque]
# Exemplos desativados: ["water", 1, 1], ["garbage", 1, 2, 50], ["panties", 1, 1, 5]
set inventory:vehicleloot [["cola",0,1],["water",0,1]]

# Possible items that can be found in a dumpster
set inventory:dumpsterloot [["aluminum",1,5],["metalscrap",1,5],["iron",1,5],["steel",1,5],["glass",1,5],["rubber",1,5],["plastic",1,5]]

# Set items to sync with framework accounts
set inventory:accounts ["money"]
